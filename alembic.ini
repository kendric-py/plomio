# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic

# repo root — alembic.ini lives at the repo root — must be on sys.path so
# `core.*`/`apps.*`/`packages.*` (absolute imports rooted at the repo root, see AGENTS.md) resolve.
prepend_sys_path = %(here)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# version location specification; This defaults
# to <script_location>/versions.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

path_separator = os

# database URL — overridden in env.py from apps.api.src.config.config.POSTGRES.DSN, so this
# placeholder is never actually used.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
