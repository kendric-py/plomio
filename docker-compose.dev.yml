# Локальный Postgres для разработки. Порт хоста — 5433 (не 5432), чтобы не конфликтовать
# с другими Postgres-контейнерами, которые уже могут быть подняты на машине разработчика.
# Креды ниже совпадают со значениями по умолчанию в apps/api/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: smpcrawl_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - smpcrawl_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smpcrawl']
      interval: 5s
      timeout: 5s
      retries: 10

  # Пул сессий worker_sessions (TTL на ключах) — см. apps/worker_sessions/AGENTS.md и
  # RedisConfig в core/configs.py. Без пароля по умолчанию, как в apps/worker_sessions/.env.example.
  redis:
    image: redis:7-alpine
    container_name: smpcrawl_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - smpcrawl_redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smpcrawl_postgres_dev_data:
  smpcrawl_redis_dev_data:
