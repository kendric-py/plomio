[tool.poetry]
name = "api"
version = "0.1.0"
description = "API service"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
uvicorn = "^0.53.0"
sqlalchemy = "^2.0.54"
alembic = "^1.20.0"
bcrypt = "^5.0.0"
pyjwt = "^2.14.0"
dependency-injector = "^4.49.1"
asyncpg = "^0.31.0"
redis = "^5.2.0"
greenlet = "^3.5.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
